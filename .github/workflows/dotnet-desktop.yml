name: Build Installer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: Aerotec.sln             # ✅ your main solution file
      Configuration: ${{ matrix.configuration }}

    steps:
    # 1️⃣ Checkout code (with submodules if Jet3up is nested)
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    # 2️⃣ Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 3️⃣ Setup MSBuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 4️⃣ Restore NuGet packages
    - name: Restore NuGet packages
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration

    # 5️⃣ Build the main solution (so binaries exist for the installer)
    - name: Build main solution
      run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration

