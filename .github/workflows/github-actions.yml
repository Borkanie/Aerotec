name: Build and Check Header

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-header:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x scripts/check_header.sh

      - name: Run header check script
        run: scripts/check_header.sh

  build-installer:
    runs-on: windows-latest
    needs: check-header  # Ensures the header check passes before building
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Restore NuGet packages
        run: nuget restore Aerotec.sln

      - name: Build the Installer Project
        run: msbuild Setup.vdproj /t:Build /p:Configuration=Release # /p:Platform=x86
        working-directory: Setup

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Installer
          path: Setup/bin/Release/*.msi  # Adjust as needed
          retention-days: 3  # Keep the artifact for 5 days
